name: Actualizar Precios Supermercados

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r smartcheck-backend/requirements.txt

      - name: 🚀 Ejecutar motor de scraping y actualización
        run: |
          python smartcheck-backend/ejecutar_sync.py
